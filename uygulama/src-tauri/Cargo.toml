[package]
name = "kalkan-uygulama"
version.workspace = true
edition.workspace = true
description = "Kalkan menü çubuğu uygulaması"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.8"
tauri-plugin-autostart = "2.7"
serde_json = "1"
