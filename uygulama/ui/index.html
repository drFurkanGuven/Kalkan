<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkan</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <main class="kabuk">
    <header class="ust">
      <div class="marka">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5 4 5.2v6.1c0 4.9 3.3 8.6 8 10.2 4.7-1.6 8-5.3 8-10.2V5.2z"/>
          <path class="nabiz" d="M7.5 12h2.4l1.3-2.8 1.8 5.4 1.3-2.6h2.2"/>
        </svg>
        <span>Kalkan</span>
      </div>
      <div class="rozetler">
        <span id="gizli-rozet" class="rozet gizli" hidden title="Gizli mod açık: yerel ağda görünmezsin">Gizli</span>
        <span id="rozet" class="rozet">…</span>
        <button id="pano-ac" class="pano-dugme" title="Geniş görünümü ayrı pencerede aç">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/></svg>
        </button>
      </div>
    </header>

    <section id="ozet" class="ozet">
      <div id="ozet-simge" class="ozet-simge"></div>
      <div class="ozet-metin">
        <h1 id="ozet-baslik">Bağlanıyor…</h1>
        <p id="ozet-alt"></p>
      </div>
    </section>
    <div id="ilerleme" class="ilerleme" hidden><div id="ilerleme-dolu"></div></div>

    <section class="sayilar">
      <div><b id="s-akis">–</b><span>akış · 1 sa</span></div>
      <div><b id="s-veri">–</b><span>veri · 1 sa</span></div>
      <div><b id="s-acik">–</b><span>açık bağlantı</span></div>
    </section>

    <section class="grafik-kutu">
      <svg id="grafik" viewBox="0 0 360 54" preserveAspectRatio="none" role="img" aria-label="Son 60 dakikanın akış grafiği"></svg>
      <div class="grafik-eksen"><span>60 dk önce</span><span>şimdi</span></div>
    </section>

    <nav class="sekmeler" role="tablist">
      <button role="tab" data-sekme="uyarilar" class="secili">Uyarılar <em id="uyari-sayi"></em></button>
      <button role="tab" data-sekme="akislar">Bağlantılar</button>
      <button role="tab" data-sekme="portlar">Ağ</button>
      <button role="tab" data-sekme="kurallar">Kurallar</button>
      <button role="tab" data-sekme="gunluk">Günlük</button>
    </nav>

    <section class="icerik">
      <div id="uyarilar" class="sekme-icerik"></div>
      <div id="akislar" class="sekme-icerik" hidden></div>
      <div id="portlar" class="sekme-icerik" hidden></div>
      <div id="kurallar" class="sekme-icerik" hidden></div>
      <div id="gunluk" class="sekme-icerik" hidden></div>
    </section>

    <footer id="alt" class="alt"></footer>
  </main>
  <script src="ornek.js"></script>
  <script src="uygulama.js"></script>
</body>
</html>
